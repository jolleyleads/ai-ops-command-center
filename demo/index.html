<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoMake AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202123;background:#fff}.app{display:flex;height:100vh}.side{width:260px;background:#f7f7f8;border-right:1px solid #ececf1;padding:14px;display:flex;flex-direction:column}.brand{font-weight:750;padding:10px 8px 18px}.new,.ghost{border:1px solid #ddd;background:white;border-radius:10px;padding:10px;cursor:pointer}.nav{margin-top:16px}.nav div{padding:10px;border-radius:8px;font-size:14px;margin:2px 0}.active{background:#ececf1}.account{margin-top:auto;border-top:1px solid #ddd;padding:14px 6px}.small,.meta{font-size:12px;color:#6b6b73}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:58px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.pill{background:#eef7f2;color:#16794c;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.chat{flex:1;overflow:auto;padding:28px 20px 160px}.wrap{max-width:840px;margin:auto}.welcome{text-align:center;padding:30px 0 20px}.welcome h1{font-size:30px;margin:0 0 9px}.welcome p{color:#6b6b73}.suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.suggestions button{border:1px solid #e2e2e2;background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}.msg{display:flex;gap:14px;padding:20px 4px;border-bottom:1px solid #f1f1f1}.avatar{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#111;color:#fff;font-size:12px;flex:0 0 auto}.avatar.ai{background:#10a37f}.bubble{line-height:1.55;min-width:0;width:100%}.msg:has(.avatar.ai) .bubble{background:#f3f4f6;border-radius:14px;padding:14px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid #e5e5e5;border-radius:10px;padding:10px;font-size:12px}.stat b{display:block;font-size:16px}.lead{border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin:10px 0}.leadtop{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;border-radius:999px;padding:5px 8px;background:#eef7f2;color:#16794c;height:max-content}.meta{margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{border:1px solid #ddd;background:white;border-radius:8px;padding:7px 10px;cursor:pointer}.actions .primary{background:#111;color:#fff}.composer-shell{position:fixed;left:260px;right:0;bottom:0;padding:38px 20px 20px;background:linear-gradient(transparent,#fff 28%)}.composer{max-width:840px;margin:auto;border:1px solid #d9d9e3;border-radius:18px;padding:12px;background:#fff;box-shadow:0 4px 20px #0000000d}.composer textarea{border:0;outline:0;width:100%;resize:none;min-height:52px;font:inherit;padding:6px}.bar{display:flex;justify-content:space-between;align-items:center}.send{width:36px;height:36px;border:0;border-radius:50%;background:#111;color:#fff;font-size:18px;cursor:pointer}.loading{display:inline-block;width:13px;height:13px;border:2px solid #ddd;border-top-color:#10a37f;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}details{margin-top:8px}.error{color:#a61b1b}@media(max-width:760px){.side{display:none}.composer-shell{left:0}.top{padding:0 14px}.chat{padding:16px 12px 150px}.stats{grid-template-columns:1fr 1fr}}.brand-logo{width:34px;height:34px;border-radius:9px;vertical-align:middle;margin-right:8px;object-fit:cover}.hero-logo-img{width:88px;height:88px;border-radius:38px;object-fit:cover;box-shadow:0 8px 28px #00000018}</style></head><body>
<div class="app"><aside class="side"><div class="brand"><img class="brand-logo" src="/chat-operator/automake-logo.svg" alt="AutoMake AI logo"> AutoMake AI</div><button class="new" onclick="newCampaign()">＋ New task</button><div class="nav"><div class="active">💬 Home</div><div onclick="loadLeads()">◎ People & companies</div><div onclick="loadOutreach()">✉ Emails</div><div>↻ Follow-up emails</div><div>▦ Automations</div><div>◷ Activity</div></div><div class="account"><b>AutoMake AI</b><div class="small">Checks information before sending</div></div></aside>
<main class="main"><header class="top"><b>AutoMake AI</b><span class="pill" id="health">● Connecting…</span></header><section class="chat"><div class="wrap" id="feed"><div class="welcome"><div class="hero-logo"><img class="hero-logo-img" src="/chat-operator/automake-logo.svg" alt="AutoMake AI"></div><h1>AutoMake AI</h1><p>Ask.Automate.Execute</p><div class="suggestions"><button onclick="fill('Find companies in Hampton Roads hiring AI, workflow, API or automation engineers. Include remote Virginia roles.')">Find automation jobs</button><button onclick="fill('Find Virginia contractors looking for a master electrician to pull permits.')">Find permit leads</button><button onclick="loadOutreach()">Review emails</button></div></div></div></section>
<div class="composer-shell"><div class="composer"><textarea id="prompt" placeholder="Message AutoMake AI…"></textarea><div class="bar"><span class="small">AutoMake AI checks contact information before sending</span><button class="send" id="send" onclick="run()">↑</button></div></div></div></main></div>
<script>
const API=location.origin; const feed=document.getElementById('feed');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fill(t){document.getElementById('prompt').value=t;document.getElementById('prompt').focus()}
function add(role,html){const d=document.createElement('div');d.className='msg';d.innerHTML='<div class="avatar '+(role==='ai'?'ai':'')+'">'+(role==='ai'?'AI':'MJ')+'</div><div class="bubble">'+html+'</div>';feed.appendChild(d);d.scrollIntoView({behavior:'smooth'});return d}
function friendlyError(d,status){const raw=String(d.error||d.message||'').trim();const reasons=[...(d.gate?.reasons||[]),...(d.send_receipt?.reasons||[]),...(d.qualification?.reasons||[])];const all=(raw+' '+reasons.join(' ')).toLowerCase();if(all.includes('qualification'))return "I need a little more information to confirm this is a good lead before I can send the email.";if(all.includes('contact_email')||all.includes('contact email'))return "I need a confirmed email address for this contact before I can send.";if(all.includes('duplicate')||all.includes('concurrent')||all.includes('already_claimed')||all.includes('not_pending'))return "This email may already be sending or was already attempted. I stopped it to prevent a duplicate.";if(all.includes('suppress')||all.includes('opt_out'))return "This contact has asked not to receive emails, so I won't send to them.";if(status===409)return "I can't send this one yet because one of the required checks isn't complete.";if(status>=500)return "I couldn't complete that right now. Please try again in a moment.";return raw||"Something went wrong. Please try again."}async function json(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(friendlyError(d,r.status));return d}
async function health(){try{await json(API+'/api/health');document.getElementById('health').textContent='● Ready'}catch{document.getElementById('health').textContent='● Having trouble connecting';document.getElementById('health').style.color='#a61b1b'}}
function newCampaign(){document.querySelectorAll('.msg').forEach(x=>x.remove());fill('')}
function resultCard(r){const title=esc(r.title||r.name||r.company||r.candidate_name||'Result'),cls=esc(r.classification||r.promotion_status||'Candidate'),url=r.url||r.website||r.source_url||'';return '<div class="lead"><div class="leadtop"><b>'+title+'</b><span class="tag">'+cls+'</span></div><div class="meta">'+esc(r.location||'')+(r.verified_claim?' • '+esc(r.verified_claim):'')+'</div>'+(r.reason?'<p>'+esc(r.reason)+'</p>':'')+(url?'<div class="actions"><button onclick="window.open('+JSON.stringify(url)+',\'_blank\')">View source</button></div>':'')+'</div>'}
async function run(){const p=document.getElementById('prompt'),q=p.value.trim();if(!q)return;p.value='';add('user','<b>You</b><br>'+esc(q));const wait=add('ai','<b>AutoMake AI</b><br><span class="loading"></span> Searching and checking the information…');document.getElementById('send').disabled=true;try{const d=await json(API+'/api/smart-search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:q,location:'Hampton Roads, Virginia'})});const rs=d.results||[];wait.querySelector('.bubble').innerHTML='<b>AutoMake AI</b><br>Done. I checked the information I could verify.<div class="stats"><div class="stat"><b>'+esc(d.candidate_count||0)+'</b>Found</div><div class="stat"><b>'+esc(d.verified_count||0)+'</b>Confirmed</div><div class="stat"><b>'+esc(d.unverified_candidate_count||0)+'</b>Needs more information</div><div class="stat"><b>'+esc(d.runtime_ms||0)+'ms</b>Time</div></div>'+rs.map(resultCard).join('')+(rs.length?'':'<p>I couldn't confirm enough information for any results yet.</p>')}catch(e){wait.querySelector('.bubble').innerHTML='<b>AutoMake AI</b><br><span class="error">'+esc(e.message)+'</span>'}finally{document.getElementById('send').disabled=false}}
async function loadLeads(){const m=add('ai','<b>AutoMake AI</b><br><span class="loading"></span> Loading your saved leads…');try{const d=await json(API+'/api/pipeline');m.querySelector('.bubble').innerHTML='<b>Saved leads</b><br>'+(d.length?d.map(x=>'<div class="lead"><div class="leadtop"><b>Lead #'+x.id+'</b><span class="tag">'+esc(x.stage)+'</span></div><p>'+esc(x.lead)+'</p><div class="meta">'+esc(x.created_at)+'</div></div>').join(''):'No saved leads yet.')}catch(e){m.querySelector('.bubble').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
async function loadOutreach(){const m=add('ai','<b>AutoMake AI</b><br><span class="loading"></span> Loading your emails…');try{const d=await json(API+'/api/outreach/leads');const ls=d.leads||[];m.querySelector('.bubble').innerHTML='<b>Emails</b><br>'+ls.slice(0,25).map(l=>'<div class="lead"><div class="leadtop"><b>'+esc(l.company)+'</b><span class="tag">'+esc(l.status)+'</span></div><div class="meta">'+esc(l.contact_name||'')+(l.contact_email?' • '+esc(l.contact_email):'')+'</div><div class="actions">'+(l.status==='qualified'?'<button onclick="draft('+l.id+')">Write email</button>':'')+(l.status==='drafted'?'<button onclick="draft('+l.id+')">Preview email</button><button class="primary" onclick="sendLead('+l.id+')">Send</button>':'')+'</div></div>').join('')}catch(e){m.querySelector('.bubble').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
async function draft(id){const m=add('ai','<b>AutoMake AI</b><br><span class="loading"></span> Writing the email…');try{const d=await json(API+'/api/outreach/leads/'+id+'/draft',{method:'POST'}),l=d.lead;m.querySelector('.bubble').innerHTML='<b>Email preview</b><div class="lead"><b>'+esc(l.subject)+'</b><p style="white-space:pre-wrap">'+esc(l.body)+'</p><div class="actions"><button class="primary" onclick="sendLead('+id+')">Send email</button></div></div>'}catch(e){m.querySelector('.bubble').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
async function sendLead(id){if(!confirm('Send this email now?'))return;const m=add('ai','<b>AutoMake AI</b><br><span class="loading"></span> Checking everything before sending…');try{const d=await json(API+'/api/outreach/leads/'+id+'/send',{method:'POST'});m.querySelector('.bubble').innerHTML='<b>Sent.</b><br>Your email was sent successfully.<details><summary>Technical details</summary><pre>'+esc(JSON.stringify(d,null,2))+'</pre></details>'}catch(e){m.querySelector('.bubble').innerHTML='<b>Not sent yet.</b><br><span class="error">'+esc(e.message)+'</span>'}}
document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}});health();
</script></body></html>
