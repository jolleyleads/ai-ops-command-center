<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AutoMake AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202123;background:#fff}.app{display:flex;height:100vh}.side{width:260px;background:#f7f7f8;border-right:1px solid #ececf1;padding:14px;display:flex;flex-direction:column}.brand{font-weight:750;padding:10px 8px 18px}.new,.ghost{border:1px solid #ddd;background:white;border-radius:10px;padding:10px;cursor:pointer}.nav{margin-top:16px}.nav div{padding:10px;border-radius:8px;font-size:14px;margin:2px 0}.active{background:#ececf1}.account{margin-top:auto;border-top:1px solid #ddd;padding:14px 6px}.small,.meta{font-size:12px;color:#6b6b73}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:58px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.pill{background:#eef7f2;color:#16794c;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.chat{flex:1;overflow:auto;padding:28px 20px 160px}.wrap{max-width:840px;margin:auto}.welcome{text-align:center;padding:30px 0 20px}.welcome h1{font-size:30px;margin:0 0 9px}.welcome p{color:#6b6b73}.suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.suggestions button{border:1px solid #e2e2e2;background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}.msg{display:flex;gap:14px;padding:20px 4px;border-bottom:1px solid #f1f1f1}.avatar{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#111;color:#fff;font-size:12px;flex:0 0 auto}.avatar.ai{background:#10a37f}.bubble{line-height:1.55;min-width:0;width:100%}.msg:has(.avatar.ai) .bubble{background:#f3f4f6;border-radius:14px;padding:14px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid #e5e5e5;border-radius:10px;padding:10px;font-size:12px}.stat b{display:block;font-size:16px}.lead{border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin:10px 0}.leadtop{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;border-radius:999px;padding:5px 8px;background:#eef7f2;color:#16794c;height:max-content}.meta{margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{border:1px solid #ddd;background:white;border-radius:8px;padding:7px 10px;cursor:pointer}.actions .primary{background:#111;color:#fff}.composer-shell{position:fixed;left:260px;right:0;bottom:0;padding:38px 20px 20px;background:linear-gradient(transparent,#fff 28%)}.composer{max-width:840px;margin:auto;border:1px solid #d9d9e3;border-radius:18px;padding:12px;background:#fff;box-shadow:0 4px 20px #0000000d}.composer textarea{border:0;outline:0;width:100%;resize:none;min-height:52px;font:inherit;padding:6px}.bar{display:flex;justify-content:space-between;align-items:center}.send{width:36px;height:36px;border:0;border-radius:50%;background:#111;color:#fff;font-size:18px;cursor:pointer}.loading{display:inline-block;width:13px;height:13px;border:2px solid #ddd;border-top-color:#10a37f;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}details{margin-top:8px}.error{color:#a61b1b}@media(max-width:760px){.side{display:none}.composer-shell{left:0}.top{padding:0 14px}.chat{padding:16px 12px 150px}.stats{grid-template-columns:1fr 1fr}}.brand-logo{width:34px;height:34px;border-radius:9px;vertical-align:middle;margin-right:8px;object-fit:cover}.hero-logo-img{width:88px;height:88px;border-radius:38px;object-fit:cover;box-shadow:0 8px 28px #00000018}</style></head><body>
<div class="app"><aside class="side"><div class="brand"><img class="brand-logo" src="/chat-operator/automake-logo.svg?v=a9c9992" alt="AutoMake AI logo"> AutoMake AI</div><button class="new" onclick="newCampaign()">＋ New task</button><div class="nav"><div class="active">💬 Home</div><div onclick="loadLeads()">◎ People & companies</div><div onclick="loadOutreach()">✉ Emails</div><div onclick="loadCampaignPerformance()">▥ Campaign Performance</div><div>↻ Follow-up emails</div><div>▦ Automations</div><div>◷ Activity</div></div><div class="account"><b>AutoMake AI</b><div class="small">Checks information before sending</div></div></aside>
<main class="main"><header class="top"><b>AutoMake AI</b><span class="pill" id="health">● Connecting…</span></header><section class="chat"><div class="wrap" id="feed"><div class="welcome"><div class="hero-logo"><img class="hero-logo-img" src="/chat-operator/automake-logo.svg?v=a9c9992" alt="AutoMake AI"></div><h1>AutoMake AI</h1><p>Ask.Automate.Execute</p><div class="suggestions"><button onclick="fill('Find companies in Hampton Roads hiring AI, workflow, API or automation engineers. Include remote Virginia roles.')">Find automation jobs</button><button onclick="fill('Find Virginia contractors looking for a master electrician to pull permits.')">Find permit leads</button><button onclick="loadOutreach()">Review emails</button></div></div></div></section>
<div class="composer-shell"><div class="composer"><textarea id="prompt" placeholder="Message AutoMake AI…" rows="2"></textarea><div class="bar"><span class="small">AutoMake AI checks contact information before sending</span><button class="ghost" id="prepare" type="button" title="Prepare drafts from verified leads; never send emails">Prepare drafts</button><button class="send" id="send" type="button" aria-label="Send prompt">↑</button></div></div></div></main></div>
<script>
var API=window.location.origin;
var feed=document.getElementById("feed");
function esc(s){s=(s===null||s===undefined)?"":String(s);return s.replace(/[&<>"']/g,function(ch){var m={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};return m[ch];});}
function fill(t){var p=document.getElementById("prompt");p.value=t;p.focus();}
function add(role,html){var d=document.createElement("div");d.className="msg";d.innerHTML='<div class="avatar '+(role==="ai"?"ai":"")+'">'+(role==="ai"?"AI":"MJ")+'</div><div class="bubble">'+html+"</div>";feed.appendChild(d);d.scrollIntoView();return d;}
function requestJSON(url,options){return fetch(url,options||{}).then(function(r){return r.text().then(function(t){var d={};try{d=t?JSON.parse(t):{};}catch(x){}if(!r.ok){throw new Error(d.error||d.message||("Request failed ("+r.status+")"));}return d;});});}
function health(){requestJSON(API+"/api/health",{cache:"no-store"}).then(function(){document.getElementById("health").textContent="● Ready";}).catch(function(){var h=document.getElementById("health");h.textContent="● Having trouble connecting";h.style.color="#a61b1b";});}
function newCampaign(){var ms=document.querySelectorAll(".msg");for(var i=0;i<ms.length;i++){ms[i].parentNode.removeChild(ms[i]);}fill("");}
function resultCard(r){var title=esc(r.title||r.name||r.company||r.candidate_name||"Result");var cls=esc(r.classification||r.promotion_status||"Candidate");var loc=esc(r.location||"");var reason=r.reason?("<p>"+esc(r.reason)+"</p>"):"";var codes=r.reason_codes||r.missing_evidence||[];if(!Array.isArray(codes))codes=[codes];if(codes.length)reason+="<p><b>Evidence still needed:</b> "+esc(codes.join(", "))+"</p>";var links=r.supporting_urls||r.evidence_urls||[];if(Array.isArray(links)){for(var i=0;i<Math.min(links.length,3);i++){var u=String(links[i]||"");if(/^https:\/\//.test(u))reason+='<p><a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Supporting source</a></p>';}}return '<div class="lead"><div class="leadtop"><b>'+title+'</b><span class="tag">'+cls+'</span></div><div class="meta">'+loc+"</div>"+reason+"</div>";}
function deepSearch(q){
var match=q.match(/\b(\d{1,2})\s+(?:companies|businesses|prospects|leads)\b/i);
return requestJSON(API+"/api/research/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:q,location:"Hampton Roads, Virginia",target_count:match?Number(match[1]):10}),cache:"no-store"}).then(function(job){
return new Promise(function(resolve,reject){var started=Date.now();function poll(){requestJSON(API+job.poll_url,{cache:"no-store"}).then(function(state){if(state.status==="completed"){resolve(state.result);return;}if(state.status==="failed"){reject(new Error(state.error||"Search failed"));return;}if(Date.now()-started>600000){reject(new Error("Search is taking longer than expected. Your task is saved; search ID: "+job.job_id));return;}setTimeout(poll,2000);}).catch(reject);}poll();});});}
function run(){var p=document.getElementById("prompt");var q=p.value.replace(/^\s+|\s+$/g,"");if(!q){return;}p.value="";add("user","<b>You</b><br>"+esc(q));var wait=add("ai",'<b>AutoMake AI</b><br><span class="loading"></span> Researching sources and checking each company. This may take a few minutes…');var send=document.getElementById("send");send.disabled=true;deepSearch(q).then(function(d){var rs=d.results||[];var cards="";for(var i=0;i<rs.length;i++){cards+=resultCard(rs[i]);}wait.querySelector(".bubble").innerHTML="<b>AutoMake AI</b><br>Research complete. Results with incomplete evidence stay marked as candidates.<div class=\"stats\"><div class=\"stat\"><b>"+esc(d.candidate_count||0)+"</b>Found</div><div class=\"stat\"><b>"+esc(d.verified_count||0)+"</b>Confirmed</div></div>"+cards+(rs.length?"":"<p>I couldn't confirm enough information for any results yet.</p>");}).catch(function(e){wait.querySelector(".bubble").innerHTML='<b>AutoMake AI</b><br><span class="error">'+esc(e.message)+"</span>";}).then(function(){send.disabled=false;});}
function loadLeads(){var m=add("ai",'<b>AutoMake AI</b><br><span class="loading"></span> Loading your saved leads…');requestJSON(API+"/api/pipeline",{cache:"no-store"}).then(function(d){var out="<b>Saved leads</b><br>";if(!d.length){out+="No saved leads yet.";}for(var i=0;i<d.length;i++){out+='<div class="lead"><b>Lead #'+esc(d[i].id)+"</b> "+esc(d[i].stage)+"<p>"+esc(d[i].lead)+"</p></div>";}m.querySelector(".bubble").innerHTML=out;}).catch(function(e){m.querySelector(".bubble").innerHTML='<span class="error">'+esc(e.message)+"</span>";});}
function statusExplanation(item){var c=String(item.last_error||item.error||"").trim();var codes=item.reason_codes||item.qualification_reason_codes||[];if(!Array.isArray(codes))codes=[codes];if(c&&!codes.includes(c))codes.unshift(c);var meanings={INTENT_SIGNAL_UNPROVEN:"No current source proves the requested business need.",MISSING_VALIDATED_CONTACT:"No source-backed contact method is verified.",NAMED_DECISION_MAKER_EMAIL_REQUIRED:"The named decision-maker and their email are not source-verified together.",EVIDENCE_RECENCY_UNPROVEN:"The evidence date is not established.",BUSINESS_TYPE_FIT_UNPROVEN:"Industry match is unproven.",GEOGRAPHIC_FIT_UNPROVEN:"Location match is unproven.",HUNTER_NOT_ENABLED:"Optional Hunter verification is not configured."};return codes.length?codes.map(function(x){return esc(x)+": "+esc(meanings[x]||"Requires review of the recorded qualification evidence.");}).join("<br>"):"Detailed reason unavailable from this endpoint. Inspect the operator qualification receipt."; }
function loadOutreach(){var m=add("ai",'<b>AutoMake AI</b><br><span class="loading"></span> Loading your saved outreach status…');requestJSON(API+"/api/chat/lead-status",{cache:"no-store"}).catch(function(){return requestJSON(API+"/api/outreach/leads",{cache:"no-store"});}).then(function(d){var ls=d.leads||[];var out="<b>Outreach pipeline</b><p>Drafted means prepared, not sent. Needs Evidence means qualification has not passed.</p>";if(!ls.length)out+="No outreach leads returned.";for(var i=0;i<ls.length&&i<25;i++){var lead=ls[i];var status=String(lead.status||"unknown");out+='<div class="lead"><b>'+esc(lead.company||"Unidentified business")+'</b><div class="meta">'+esc(status)+'</div>';if(status==="needs_evidence"||status==="rejected")out+="<p><b>Why held:</b> "+statusExplanation(lead)+"</p>";if(lead.recovery_state)out+="<p>Recovery: "+esc(lead.recovery_state)+(lead.next_check_at?" · Next check: "+esc(lead.next_check_at):"")+"</p>";if(status==="drafted")out+="<p>Personalized draft prepared. No send is confirmed by this status.</p>";out+="</div>";}m.querySelector(".bubble").innerHTML=out;}).catch(function(e){m.querySelector(".bubble").innerHTML='<span class="error">'+esc(e.message)+"</span>";});}
function draft(id){add("ai","Email drafting is available from the Emails workflow.");}
function sendLead(id){add("ai","Sending remains protected by AutoMake AI verification and safe-send checks.");}
function prepareCampaign(){var q=document.getElementById("prompt").value.trim();if(!q){add("ai","Enter a business discovery request first.");return;}if(!window.confirm("Research, qualify, and prepare draft messages for this campaign? No emails will be sent."))return;var territory=window.prompt("Target city or territory?","Hampton Roads, Virginia");if(!territory)return;var m=q.match(/\b(\d{1,2})\s+(?:companies|businesses|prospects|leads)\b/i);var body={target_customer:q,territory:territory,target_count:m?Number(m[1]):10};var key=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now());var wait=add("ai",'<b>AutoMake AI</b><p>Preparing an evidence-gated, draft-only campaign…</p>');var button=document.getElementById("prepare");button.disabled=true;requestJSON(API+"/api/chat/campaigns/prepare",{method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":key},body:JSON.stringify(body)}).then(function(job){function poll(){requestJSON(API+job.poll_url,{cache:"no-store"}).then(function(state){if(state.status==="queued"||state.status==="running"){wait.querySelector(".bubble").innerHTML="<b>AutoMake AI</b><p>Campaign "+esc(state.status)+" — researching, verifying and preparing drafts.</p>";setTimeout(poll,5000);return;}wait.querySelector(".bubble").innerHTML="<b>Campaign "+esc(state.status)+"</b><p>"+esc(state.error||"See the Emails section for saved qualifications and drafts.")+"</p><pre style='white-space:pre-wrap'>"+esc(JSON.stringify(state.result||{},null,2).slice(0,8000))+"</pre>";button.disabled=false;}).catch(function(e){wait.querySelector(".bubble").textContent="Status check failed: "+e.message;button.disabled=false;});}poll();}).catch(function(e){wait.querySelector(".bubble").textContent="Campaign not started: "+e.message;button.disabled=false;});}
var promptBox=document.getElementById("prompt");
var sendButton=document.getElementById("send");
sendButton.onclick=function(){run();return false;};
document.getElementById("prepare").onclick=prepareCampaign;
promptBox.onkeydown=function(e){e=e||window.event;if((e.keyCode===13||e.key==="Enter")&&!e.shiftKey){if(e.preventDefault){e.preventDefault();}run();return false;}};
health();

function loadCampaignPerformance(){
  var slot=add("ai","<b>Campaign Performance</b><p class='meta'>Loading pipeline records…</p>");
  requestJSON(API+"/api/chat/lead-status",{cache:"no-store"}).then(function(data){
    var items=Array.isArray(data.leads)?data.leads:[];
    var counts={found:items.length,qualified:0,pending:0,rejected:0,sent:0};
    items.forEach(function(x){
      var state=String(x.status||"").toLowerCase();
      if(["qualified","sent","replied","booked"].indexOf(state)!==-1)counts.qualified++;
      if(["needs_evidence","review"].indexOf(state)!==-1)counts.pending++;
      if(state==="rejected")counts.rejected++;
      if(x.has_sent_message)counts.sent++;
    });
    var html="<b>Campaign Performance</b><p class='meta'>Recent "+items.length+" operator lead records, not campaign-specific totals.</p>";
    html+='<div class="stats"><div class="stat"><b>'+counts.found+'</b>Recent leads</div><div class="stat"><b>'+counts.qualified+'</b>Qualified / downstream</div><div class="stat"><b>'+counts.pending+'</b>Needs review</div><div class="stat"><b>'+counts.sent+'</b>Recorded sends</div></div>';
    html+="<p class='meta'>Replies, delivery, bookings, revenue and conversion rates are not available from this endpoint. No estimates shown.</p>";
    html+="<p class='meta'>Last checked: "+esc(new Date().toLocaleString())+"</p>";
    slot.querySelector(".bubble").innerHTML=html;
  }).catch(function(err){slot.querySelector(".bubble").innerHTML="<b>Campaign Performance</b><p class='error'>"+esc(err.message)+"</p><p class='meta'>Authorization required. No sample data displayed.</p>";});
}

</script></body></html>
