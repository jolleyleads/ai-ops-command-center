<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AutoMake AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202123;background:#fff}.app{display:flex;height:100vh}.side{width:260px;background:#f7f7f8;border-right:1px solid #ececf1;padding:14px;display:flex;flex-direction:column}.brand{font-weight:750;padding:10px 8px 18px}.new,.ghost{border:1px solid #ddd;background:white;border-radius:10px;padding:10px;cursor:pointer}.nav{margin-top:16px}.nav div{padding:10px;border-radius:8px;font-size:14px;margin:2px 0}.active{background:#ececf1}.account{margin-top:auto;border-top:1px solid #ddd;padding:14px 6px}.small,.meta{font-size:12px;color:#6b6b73}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:58px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.pill{background:#eef7f2;color:#16794c;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.chat{flex:1;overflow:auto;padding:28px 20px 160px}.wrap{max-width:840px;margin:auto}.welcome{text-align:center;padding:30px 0 20px}.welcome h1{font-size:30px;margin:0 0 9px}.welcome p{color:#6b6b73}.suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.suggestions button{border:1px solid #e2e2e2;background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}.msg{display:flex;gap:14px;padding:20px 4px;border-bottom:1px solid #f1f1f1}.avatar{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#111;color:#fff;font-size:12px;flex:0 0 auto}.avatar.ai{background:#10a37f}.bubble{line-height:1.55;min-width:0;width:100%}.msg:has(.avatar.ai) .bubble{background:#f3f4f6;border-radius:14px;padding:14px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid #e5e5e5;border-radius:10px;padding:10px;font-size:12px}.stat b{display:block;font-size:16px}.lead{border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin:10px 0}.leadtop{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;border-radius:999px;padding:5px 8px;background:#eef7f2;color:#16794c;height:max-content}.meta{margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{border:1px solid #ddd;background:white;border-radius:8px;padding:7px 10px;cursor:pointer}.actions .primary{background:#111;color:#fff}.composer-shell{position:fixed;left:260px;right:0;bottom:0;padding:38px 20px 20px;background:linear-gradient(transparent,#fff 28%)}.composer{max-width:840px;margin:auto;border:1px solid #d9d9e3;border-radius:18px;padding:12px;background:#fff;box-shadow:0 4px 20px #0000000d}.composer textarea{border:0;outline:0;width:100%;resize:none;min-height:52px;font:inherit;padding:6px}.bar{display:flex;justify-content:space-between;align-items:center}.send{width:36px;height:36px;border:0;border-radius:50%;background:#111;color:#fff;font-size:18px;cursor:pointer}.loading{display:inline-block;width:13px;height:13px;border:2px solid #ddd;border-top-color:#10a37f;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}details{margin-top:8px}.error{color:#a61b1b}@media(max-width:760px){.side{display:none}.composer-shell{left:0}.top{padding:0 14px}.chat{padding:16px 12px 150px}.stats{grid-template-columns:1fr 1fr}}.brand-logo{width:34px;height:34px;border-radius:9px;vertical-align:middle;margin-right:8px;object-fit:cover}.hero-logo-img{width:88px;height:88px;border-radius:38px;object-fit:cover;box-shadow:0 8px 28px #00000018}</style></head><body>
<div class="app"><aside class="side"><div class="brand"><img class="brand-logo" src="/chat-operator/automake-logo.svg?v=a9c9992" alt="AutoMake AI logo"> AutoMake AI</div><button class="new" onclick="newCampaign()">＋ New task</button><div class="nav"><div class="active">💬 Home</div><div onclick="loadLeads()">◎ People & companies</div><div onclick="loadOutreach()">✉ Emails</div><div onclick="showFollowups()">↻ Follow-up emails</div><div onclick="showCampaignWizard()">▦ Automations</div><div onclick="showActivity()">◷ Activity</div></div><div class="account"><b>AutoMake AI</b><div class="small">Checks information before sending</div></div></aside>
<main class="main"><header class="top"><b>AutoMake AI</b><span class="pill" id="health">● Connecting…</span></header><section class="chat"><div class="wrap" id="feed"><div class="welcome"><div class="hero-logo"><img class="hero-logo-img" src="/chat-operator/automake-logo.svg?v=a9c9992" alt="AutoMake AI"></div><h1>AutoMake AI</h1><p>Ask.Automate.Execute</p><div class="suggestions"><button onclick="fill('Find companies in Hampton Roads hiring AI, workflow, API or automation engineers. Include remote Virginia roles.')">Find automation jobs</button><button onclick="fill('Find Virginia contractors looking for a master electrician to pull permits.')">Find permit leads</button><button onclick="fill('rank companies: Company One, Company Two')" type="button">Rank review + hiring signals</button>
<button onclick="loadOutreach()">Review emails</button><button onclick="showCampaignWizard()">Launch sales campaign</button><button onclick="showActivity()">Campaign dashboard</button></div></div></div></section>
<div class="composer-shell"><div class="composer"><textarea id="prompt" placeholder="Message AutoMake AI…" rows="2"></textarea><div class="bar"><span class="small">AutoMake AI checks contact information before sending</span><button class="send" id="send" type="button" aria-label="Send prompt">↑</button></div></div></div></main></div>
<script>
var API=window.location.origin;
var feed=document.getElementById("feed");
function esc(s){s=(s===null||s===undefined)?"":String(s);return s.replace(/[&<>"']/g,function(ch){var m={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};return m[ch];});}
function fill(t){var p=document.getElementById("prompt");p.value=t;p.focus();}
function add(role,html){var d=document.createElement("div");d.className="msg";d.innerHTML='<div class="avatar '+(role==="ai"?"ai":"")+'">'+(role==="ai"?"AI":"MJ")+'</div><div class="bubble">'+html+"</div>";feed.appendChild(d);d.scrollIntoView();return d;}
function requestJSON(url,options){return fetch(url,options||{}).then(function(r){return r.text().then(function(t){var d={};try{d=t?JSON.parse(t):{};}catch(x){}if(!r.ok){throw new Error(d.error||d.message||("Request failed ("+r.status+")"));}return d;});});}
function apiError(e){if(e&&/operator authentication required/i.test(e.message||""))return '<p>Your saved lead records require operator sign-in.</p><p><a href="/operator/login">Sign in to AutoMake</a></p>';return '<span class="error">'+esc(e&&e.message||"Request failed")+'</span>';}
function health(){requestJSON(API+"/api/health",{cache:"no-store"}).then(function(){document.getElementById("health").textContent="● App online";}).catch(function(){var h=document.getElementById("health");h.textContent="● Having trouble connecting";h.style.color="#a61b1b";});}
function newCampaign(){var ms=document.querySelectorAll(".msg");for(var i=0;i<ms.length;i++){ms[i].parentNode.removeChild(ms[i]);}fill("");}
function sourceLink(url,label){try{var u=new URL(url);if(u.protocol!=="https:"&&u.protocol!=="http:")return "";return '<p><a href="'+esc(u.href)+'" target="_blank" rel="noopener noreferrer">'+esc(label||u.hostname)+'</a></p>';}catch(e){return "";}}
function evidenceLinks(r){var seen={};var out="";var urls=r.supporting_urls||[];for(var i=0;i<urls.length&&i<6;i++){if(urls[i]===r.url||seen[urls[i]])continue;seen[urls[i]]=true;out+=sourceLink(urls[i],"Supporting evidence");}return out;}
function resultCard(r){var title=esc(r.title||r.name||r.company||r.candidate_name||"Result");var cls=esc(r.classification||r.promotion_status||"Candidate");var detail=r.verified_claim||r.subtitle||r.description||"";var date=r.posted_at||r.published_date||r.published_at||"";return '<div class="lead"><div class="leadtop"><b>'+title+'</b><span class="tag">'+cls+'</span></div><div class="meta">'+esc(r.location||"")+'</div>'+(detail?'<p>'+esc(detail)+'</p>':"")+(date?'<div class="meta">Source date: '+esc(date)+'</div>':"")+(r.reason?'<p>'+esc(r.reason)+'</p>':"")+sourceLink(r.url||r.source_url,r.source||"View source")+evidenceLinks(r)+'</div>';}

var campaignHistory=[];
function showCampaignWizard(){
var m=add("ai",'<b>Launch a verified outreach campaign</b><p>Asking questions only searches and shows results. A campaign is a separate action that requires operator sign-in and a launch confirmation; it may send emails if autosend is enabled.</p><p><a href="/operator/login">Operator sign-in</a></p><div class="lead"><label>Target businesses<br><input id="campTarget" placeholder="e.g. HVAC companies hiring dispatchers" style="width:100%;padding:9px"></label><br><label>Territory<br><input id="campTerritory" value="Hampton Roads, Virginia" style="width:100%;padding:9px"></label><br><label>Offer<br><textarea id="campOffer" placeholder="Describe the service you sell" style="width:100%;padding:9px"></textarea></label><br><label>Maximum sending limit<br><input id="campLimit" type="number" min="1" max="100" value="5" style="width:90px;padding:9px"></label><p class="small">Verification, qualification and safe-send checks remain active. This action is not a dry run.</p><button class="new" onclick="launchOperatorCampaign()">Review and launch campaign</button></div>');
return m;
}
function launchOperatorCampaign(){
var target=document.getElementById("campTarget"),territory=document.getElementById("campTerritory"),offer=document.getElementById("campOffer"),limit=document.getElementById("campLimit");
if(!target||!territory||!offer||!limit)return;
var data={target_customer:target.value.trim(),territory:territory.value.trim(),offer:offer.value.trim(),sending_limit:Number(limit.value)};
if(!data.target_customer||!data.territory||!data.offer||!Number.isInteger(data.sending_limit)||data.sending_limit<1||data.sending_limit>100){add("ai","Enter a target, territory, offer and a sending limit from 1 to 100.");return;}
if(!window.confirm("Launch this campaign? The server may send up to "+data.sending_limit+" outreach emails if autosend is enabled. Continue?"))return;
var wait=add("ai",'<b>Campaign</b><br><span class="loading"></span> Running verification, qualification and outreach gates…');
requestJSON(API+"/api/operator/campaign-session",{cache:"no-store"}).then(function(session){return requestJSON(API+"/api/demo/campaigns/launch",{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":session.csrf_token},body:JSON.stringify(data)});}).then(function(d){
campaignHistory.unshift({at:new Date().toISOString(),target:data.target_customer,territory:data.territory,data:d});
var disc=d.discovery||{},out=d.outreach||{},rows=disc.results||[];
var html='<b>Campaign results</b><div class="stats"><div class="stat"><b>'+esc(disc.verified||0)+'</b>Verified</div><div class="stat"><b>'+esc(out.qualified||0)+'</b>Qualified</div><div class="stat"><b>'+esc(out.drafted||0)+'</b>Drafted</div><div class="stat"><b>'+esc(out.sent||0)+'</b>Sent</div></div><p class="small">Actual returned counts; no inferred replies or appointments.</p>';
for(var i=0;i<rows.length&&i<15;i++){var x=rows[i],rank=x.prospect_ranking||{};html+='<div class="lead"><b>'+esc(x.company)+'</b> · '+esc(x.verification)+' · Tier '+esc(rank.tier||"—")+'<p>'+esc(x.evidence_basis)+'</p>'+(x.source_url?'<a href="'+esc(x.source_url)+'" target="_blank" rel="noopener noreferrer">Source</a>':"")+'</div>';}
html+='<details><summary>Full campaign receipt and diagnostics</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(d,null,2))+'</pre></details>';
wait.querySelector(".bubble").innerHTML=html;
}).catch(function(e){campaignHistory.unshift({at:new Date().toISOString(),target:data.target_customer,error:e.message});wait.querySelector(".bubble").innerHTML='<b>Campaign stopped or failed</b><p class="error">'+esc(e.message)+'</p><p>Check activity and saved leads before retrying to avoid duplicate outreach.</p>';});
}
function showActivity(){
var html='<b>Campaign activity and results</b><p class="small">This page shows activity from this browser session. Saved lead status is loaded from the server. It does not imply delivery, reply or booking.</p>';
if(!campaignHistory.length)html+='<p>No campaigns launched from this browser session.</p>';
for(var i=0;i<campaignHistory.length;i++){var x=campaignHistory[i],o=(x.data||{}).outreach||{};html+='<div class="lead"><b>'+esc(x.target)+'</b><div class="meta">'+esc(x.at)+'</div><p>Qualified: '+esc(o.qualified||0)+' · Drafted: '+esc(o.drafted||0)+' · Sent: '+esc(o.sent||0)+'</p>'+(x.error?'<p class="error">'+esc(x.error)+'</p>':"")+'</div>';}
var m=add("ai",html+'<p><button class="new" onclick="loadLeads()">View saved leads</button> <button class="new" onclick="loadOutreach()">View outreach status</button></p>');return m;
}
function showFollowups(){add("ai",'<b>Follow-up monitoring</b><p>View the current server-recorded outreach status below. This screen does not claim follow-ups are scheduled, replies detected, or calendar meetings booked unless those actions have actual receipts.</p>');loadOutreach();}
function run(){var p=document.getElementById("prompt");var q=p.value.replace(/^\s+|\s+$/g,"");if(!q){return;}if(/^rank companies\s*:/i.test(q)){runDualSignal(q);p.value="";return;}p.value="";add("user","<b>You</b><br>"+esc(q));var wait=add("ai",'<b>AutoMake AI</b><br><span class="loading"></span> Searching and checking the information…');var send=document.getElementById("send");send.disabled=true;requestJSON(API+"/api/smart-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:q,location:""}),cache:"no-store"}).then(function(d){var rs=d.results||[];var cards="";for(var i=0;i<rs.length;i++){cards+=resultCard(rs[i]);}wait.querySelector(".bubble").innerHTML="<b>AutoMake AI</b><br>Done.<div class=\"stats\"><div class=\"stat\"><b>"+esc(rs.length)+"</b>Results</div><div class=\"stat\"><b>"+esc(d.verified_count||0)+"</b>Confirmed</div></div>"+(d.message?"<p class=\"small\">"+esc(d.message)+"</p>":"")+cards+(rs.length?"":"<p>I couldn't confirm enough information for any results yet.</p>");}).catch(function(e){wait.querySelector(".bubble").innerHTML='<b>AutoMake AI</b><br><span class="error">'+esc(e.message)+"</span>";}).then(function(){send.disabled=false;});}
function loadLeads(){var m=add("ai",'<b>AutoMake AI</b><br><span class="loading"></span> Loading your saved leads…');requestJSON(API+"/api/outreach/leads",{cache:"no-store"}).then(function(d){var ls=d.leads||[];var out="<b>Saved leads ("+esc(ls.length)+")</b><br>";if(!ls.length)out+="No saved leads yet.";for(var i=0;i<ls.length;i++){var x=ls[i];out+='<div class="lead"><b>'+esc(x.company||("Lead #"+x.id))+'</b><div class="meta">'+esc(x.status)+' · '+esc(x.verification||"Unverified")+'</div><p>'+esc(x.location||"")+'</p>'+sourceLink(x.source_url,"Research source")+'</div>';}m.querySelector(".bubble").innerHTML=out;}).catch(function(e){m.querySelector(".bubble").innerHTML=apiError(e);});}

function loadOutreach(){var m=add("ai",'<b>AutoMake AI</b><br><span class="loading"></span> Loading your emails…');requestJSON(API+"/api/outreach/leads",{cache:"no-store"}).then(function(d){var ls=d.leads||[];var out="<b>Emails</b><br>";for(var i=0;i<ls.length&&i<25;i++){out+='<div class="lead"><b>'+esc(ls[i].company)+"</b><div class=\"meta\">"+esc(ls[i].status)+"</div>"+(ls[i].gmail_message_id?"<p>Gmail send receipt recorded"+(ls[i].sent_at?" · "+esc(ls[i].sent_at):"")+"</p>":"")+(ls[i].follow_up_due_at?"<p>Follow-up due: "+esc(ls[i].follow_up_due_at)+"</p>":"")+(ls[i].last_error?"<p class=\"error\">"+esc(ls[i].last_error)+"</p>":"")+"</div>";}m.querySelector(".bubble").innerHTML=out;}).catch(function(e){m.querySelector(".bubble").innerHTML=apiError(e);});}
function draft(id){add("ai","Email drafting is available from the Emails workflow.");}
function sendLead(id){add("ai","Sending remains protected by AutoMake AI verification and safe-send checks.");}
function runDualSignal(q){
var companies=q.replace(/^rank companies\s*:/i,"").split(",").map(function(x){return x.trim();}).filter(Boolean);
add("user","<b>You</b><br>"+esc(q));
var wait=add("ai",'<b>AutoMake AI</b><br><span class="loading"></span> Checking dated complaint and hiring evidence…');
if(!companies.length||companies.length>5){wait.querySelector(".bubble").innerHTML="Provide 1–5 company names separated by commas.";return;}
requestJSON(API+"/api/demo/prospect-ranking",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({companies:companies,territory:"Hampton Roads, Virginia"})}).then(function(d){
var rows=d.results||[],out="<b>Dual-signal prospect ranking</b><p>Only dated, source-linked matches are counted. Missing evidence is not a negative finding.</p>";
for(var i=0;i<rows.length;i++){var x=rows[i];out+='<div class="lead"><b>'+esc(x.company)+'</b> — Tier '+esc(x.tier)+' | Score '+esc(x.score)+'<div class="meta">Complaint sources: '+esc(x.verified_complaints)+' · Hiring sources: '+esc(x.verified_hiring)+'</div>';var links=(x.complaint_sources||[]).concat(x.hiring_sources||[]);for(var j=0;j<links.length;j++){out+='<p><a target="_blank" rel="noopener noreferrer" href="'+esc(links[j])+'">'+esc(links[j])+'</a></p>';}out+='</div>';}
wait.querySelector(".bubble").innerHTML=out;
}).catch(function(e){wait.querySelector(".bubble").innerHTML='<span class="error">'+esc(e.message)+'</span>';});
}
var promptBox=document.getElementById("prompt");
var sendButton=document.getElementById("send");
sendButton.onclick=function(){run();return false;};
promptBox.onkeydown=function(e){e=e||window.event;if((e.keyCode===13||e.key==="Enter")&&!e.shiftKey){if(e.preventDefault){e.preventDefault();}run();return false;}};
health();
</script></body></html>
