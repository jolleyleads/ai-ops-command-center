name: Music video studio checks
on:
  push:
    branches: [music-video-studio-mvp]
    paths: ['music-video-studio/**', '.github/workflows/music-video-studio.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r music-video-studio/requirements.txt pytest httpx
      - run: python -m pytest tests -q
        working-directory: music-video-studio
      - name: Render FFmpeg smoke video
        run: |
          cd music-video-studio
          python - <<'PY'
          import subprocess, tempfile
          from pathlib import Path
          from PIL import Image
          from app import preview, duration
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)
              Image.new("RGB",(320,480),"#314260").save(p/"p.png")
              subprocess.run(["ffmpeg","-y","-f","lavfi","-i","sine=frequency=420:duration=2","-c:a","pcm_s16le",str(p/"sound.wav")],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              preview(p/"p.png",p/"sound.wav",p/"result.mp4",p)
              assert (p/"result.mp4").stat().st_size > 1000
              assert 1.5<duration(p/"result.mp4")<2.5
              print("Preview smoke video passed")
          PY

  provider-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect MuseTalk Space API contract
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls=["https://huggingface.co/api/spaces/henrybit/musetalk-1-5", "https://henrybit-musetalk-1-5.hf.space/config"]
          for url in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"AI-Music-Video-Studio/0.1"}),timeout=20) as response:
                      body=response.read(200000)
                      d=json.loads(body)
                      if url.endswith("/config"):
                          print("status",response.status,"api_prefix",d.get("api_prefix"),"version",d.get("version"))
                          for dep in d.get("dependencies",[]):
                              print("api_name",dep.get("api_name"),"inputs",dep.get("inputs"),"outputs",dep.get("outputs"))
                      else:
                          print("status",response.status,"runtime",d.get("runtime"),"private",d.get("private"),"disabled",d.get("disabled"))
              except Exception as e:
                  print("FAILED",url,type(e).__name__,str(e)[:300])
          PY

  provider-generation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install "gradio_client>=1.8,<3" pillow
      - name: Generate two-second singing clip through live HF Gradio
        run: |
          python - <<'PY'
          import pathlib, tempfile, subprocess, urllib.request
          from gradio_client import Client, handle_file
          with tempfile.TemporaryDirectory() as tmp:
              p=pathlib.Path(tmp)
              urllib.request.urlretrieve("https://raw.githubusercontent.com/opencv/opencv/master/samples/data/lena.jpg",p/"portrait.jpg")
              subprocess.run(["ffmpeg","-y","-f","lavfi","-i","sine=frequency=440:duration=2","-ac","1","-ar","16000",str(p/"audio.wav")],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              client=Client("henrybit/musetalk-1-5")
              result=client.predict(handle_file(str(p/"audio.wav")),handle_file(str(p/"portrait.jpg")),0,10,"jaw",90,90,api_name="/generate")
              print("Model output:",repr(result)[:1000])
              def find_path(x):
                  if isinstance(x,str) and x.lower().endswith(".mp4"):return x
                  if isinstance(x,dict):
                      for v in x.values():
                          found=find_path(v)
                          if found:return found
                  if isinstance(x,(list,tuple)):
                      for v in x:
                          found=find_path(v)
                          if found:return found
              path=find_path(result)
              assert path and pathlib.Path(path).is_file(), "Provider returned no MP4"
              assert pathlib.Path(path).stat().st_size>1000,"Provider MP4 empty"
              print("LIVE PROVIDER GENERATION SUCCESS",path)
          PY
