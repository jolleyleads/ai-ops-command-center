name: Controlled Live Acceptance
on:
  push:
    branches: [live-acceptance-20260923]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Create qualified controlled lead and send through production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-ops-command-center.onrender.com"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="{\"company\":\"V1 Controlled Acceptance\",\"contact_email\":\"Jolleyleads@gmail.com\",\"contact_name\":\"Matthew\",\"location\":\"Portsmouth, VA\",\"source_url\":\"https://example.com/v1-acceptance\",\"score\":100,\"verification\":\"controlled_acceptance\",\"evidence\":[{\"url\":\"https://example.com/v1-acceptance/contact\",\"email\":\"Jolleyleads@gmail.com\",\"title\":\"V1 controlled acceptance contact\",\"text\":\"Controlled V1 acceptance lead for deterministic production verification\",\"observed_at\":\"$NOW\"}]}"
          CREATE=$(curl --fail-with-body -sS -H 'Content-Type: application/json' -d "$BODY" "$BASE/api/outreach/leads")
          ID=$(printf '%s' "$CREATE" | python -c 'import sys,json; d=json.load(sys.stdin); assert d["qualification"]["ok"] is True,d; print(d["lead"]["id"])')
          DRAFT=$(curl --fail-with-body -sS -X POST "$BASE/api/outreach/leads/$ID/draft")
          printf '%s' "$DRAFT" | python -c 'import sys,json; d=json.load(sys.stdin); assert d["ok"] is True,d'
          SEND=$(curl --fail-with-body -sS -X POST "$BASE/api/outreach/leads/$ID/send")
          printf '%s' "$SEND" | python -c 'import sys,json; d=json.load(sys.stdin); assert d["ok"] is True,d; l=d["lead"]; assert l["gmail_message_id"] and l["gmail_thread_id"],d; print("LIVE_ACCEPTANCE_LEAD_ID="+str(l["id"])); print("LIVE_ACCEPTANCE_MESSAGE_ID="+l["gmail_message_id"]); print("LIVE_ACCEPTANCE_THREAD_ID="+l["gmail_thread_id"])'
