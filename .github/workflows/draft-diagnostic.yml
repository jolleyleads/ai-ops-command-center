name: Production Draft Diagnostic
on:
  push:
    branches: [fix-live-draft-409]
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Capture exact draft validation response
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-ops-command-center.onrender.com"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="{\"company\":\"V1 Draft Diagnostic\",\"contact_email\":\"qa@example.com\",\"contact_name\":\"QA\",\"location\":\"Portsmouth, VA\",\"source_url\":\"https://example.com/v1-acceptance\",\"score\":100,\"verification\":\"controlled_acceptance\",\"evidence\":[{\"url\":\"https://example.com/v1-acceptance/contact\",\"email\":\"qa@example.com\",\"title\":\"V1 controlled acceptance contact\",\"text\":\"Controlled V1 acceptance lead for deterministic production verification\",\"observed_at\":\"$NOW\"}]}"
          CREATE=$(curl --fail-with-body -sS -H 'Content-Type: application/json' -d "$BODY" "$BASE/api/outreach/leads")
          ID=$(printf '%s' "$CREATE" | python -c 'import sys,json; d=json.load(sys.stdin); assert d["qualification"]["ok"] is True,d; print(d["lead"]["id"])')
          DRAFT_FILE=$(mktemp)
          STATUS=$(curl -sS -o "$DRAFT_FILE" -w '%{http_code}' -X POST "$BASE/api/outreach/leads/$ID/draft")
          echo "DRAFT_HTTP_STATUS=$STATUS"
          cat "$DRAFT_FILE"
          echo
          test "$STATUS" = "200"
