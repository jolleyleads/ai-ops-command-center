name: V1.1 Production Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-proof
  cancel-in-progress: false

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for live service readiness
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BASE="https://ai-ops-command-center.onrender.com"
          consecutive=0
          for i in {1..36}; do
            code=$(curl --silent --connect-timeout 5 --max-time 10 -o health.json -w '%{http_code}' "$BASE/api/health" || true)
            live_sha=$(python - <<'PY'
          import json
          try:
              print(json.load(open("health.json", encoding="utf-8")).get("git_commit", ""))
          except Exception:
              print("")
          PY
            )
            echo "readiness attempt $i: HTTP $code live_sha=$live_sha expected=$GITHUB_SHA (consecutive=$consecutive)"
            if [[ "$code" == "200" && "$live_sha" == "$GITHUB_SHA" ]]; then
              consecutive=$((consecutive + 1))
              if [[ "$consecutive" -ge 3 ]]; then
                echo "Exact deployed commit passed 3 consecutive application health checks"
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 5
          done
          echo "FAIL: exact commit did not pass 3 consecutive /api/health checks inside bounded readiness window" >&2
          exit 1

      - name: Call live one-shot acceptance harness
        id: acceptance
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          URL="https://ai-ops-command-center.onrender.com/api/operator/v1-1-acceptance-once"
          # One bounded attempt. Do not multiply a slow/hung server request with
          # curl retries: a timeout is a real acceptance failure that must surface.
          HTTP_CODE=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 240 \
            -X POST \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -o acceptance.json \
            -w '%{http_code}' \
            "$URL") || {
              rc=$?
              echo "FAIL: acceptance transport did not complete inside the 240s budget (curl exit $rc)"
              test -f acceptance.json && cat acceptance.json || true
              exit "$rc"
            }
          echo "HTTP $HTTP_CODE"
          cat acceptance.json
          python - <<'PY'
          import json, sys
          with open('acceptance.json', encoding='utf-8') as f:
              data=json.load(f)
          print(json.dumps(data, indent=2, sort_keys=True))
          if data.get('ok') is not True or data.get('pass') is not True or data.get('stage') != 'complete':
              print('FAIL: production acceptance did not return ok=true, pass=true, stage=complete', file=sys.stderr)
              sys.exit(1)
          print('PASS: V1.1 production acceptance complete')
          PY

      - name: Publish acceptance summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V1.1 Production Acceptance'
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            if [ -f acceptance.json ]; then
              echo '```json'
              cat acceptance.json
              echo
              echo '```'
            else
              echo 'No JSON response was produced. Acceptance failed before a receipt was returned.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-production-acceptance-receipt
          path: acceptance.json
          if-no-files-found: warn
          retention-days: 14
