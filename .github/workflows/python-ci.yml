name: Python CI

on:
  push:
    branches:
      - main
      - prospect-scoring-v1

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        pip install pytest

    - name: Compile Python
      run: python -m py_compile app.py prospect_engine.py prospect_sources.py prospect_app.py commercial_app.py

    - name: Run Tests
      id: pytest
      shell: bash
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        set +e
        python -m pytest -q 2>&1 | tee pytest-output.txt
        status=${PIPESTATUS[0]}
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit $status

    - name: Upload pytest output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-output
        path: pytest-output.txt
