name: ChatGPT AI Ops Search Bridge

on:
  push:
    branches: [main]
    paths:
      - 'chatgpt_search_request.txt'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run requested search against production AI Ops
        env:
          AI_OPS_ORIGIN: https://ai-ops-command-center.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          with open('chatgpt_search_request.txt', 'r', encoding='utf-8') as fh:
              lines = [line.strip() for line in fh.readlines()]

          query = lines[0] if lines else ''
          location = lines[1] if len(lines) > 1 else ''
          if not query:
              raise SystemExit('Search request is missing query')
          if len(query) > 500 or len(location) > 200:
              raise SystemExit('Search request exceeds allowed length')

          params = urllib.parse.urlencode({'query': query, 'location': location})
          url = f"{os.environ['AI_OPS_ORIGIN']}/api/test-smart-search?{params}"
          req = urllib.request.Request(url, headers={'User-Agent': 'AI-Ops-ChatGPT-Bridge/1.0'})
          with urllib.request.urlopen(req, timeout=180) as response:
              body = response.read().decode('utf-8', errors='replace')

          payload = json.loads(body)
          safe_output = {
              'query': query,
              'location': location,
              'intent': payload.get('intent'),
              'configured': payload.get('configured'),
              'count': payload.get('count'),
              'source': payload.get('source'),
              'message': payload.get('message'),
              'results': payload.get('results') or [],
          }
          print('AI_OPS_CHATGPT_RESULT=' + json.dumps(safe_output, ensure_ascii=False))
          PY