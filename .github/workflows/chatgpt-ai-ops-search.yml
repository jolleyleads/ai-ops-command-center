name: ChatGPT AI Ops Search Bridge

on:
  push:
    branches: [main]
    paths:
      - 'chatgpt_search_request.json'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run requested search against production AI Ops
        env:
          AI_OPS_ORIGIN: https://ai-ops-command-center.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          with open('chatgpt_search_request.json', 'r', encoding='utf-8') as fh:
              request_data = json.load(fh)

          query = str(request_data.get('query') or '').strip()
          location = str(request_data.get('location') or '').strip()
          request_id = str(request_data.get('request_id') or '').strip()
          if not query:
              raise SystemExit('Search request is missing query')
          if len(query) > 500 or len(location) > 200 or len(request_id) > 100:
              raise SystemExit('Search request exceeds allowed length')

          params = urllib.parse.urlencode({'query': query, 'location': location})
          url = f"{__import__('os').environ['AI_OPS_ORIGIN']}/api/test-smart-search?{params}"
          req = urllib.request.Request(url, headers={'User-Agent': 'AI-Ops-ChatGPT-Bridge/1.0'})
          with urllib.request.urlopen(req, timeout=180) as response:
              body = response.read().decode('utf-8', errors='replace')
              if response.status != 200:
                  raise SystemExit(f'AI Ops returned HTTP {response.status}')

          payload = json.loads(body)
          safe_output = {
              'request_id': request_id,
              'query': query,
              'location': location,
              'intent': payload.get('intent'),
              'configured': payload.get('configured'),
              'count': payload.get('count'),
              'source': payload.get('source'),
              'message': payload.get('message'),
              'results': payload.get('results') or [],
          }
          print('AI_OPS_CHATGPT_RESULT=' + json.dumps(safe_output, ensure_ascii=False))
          PY