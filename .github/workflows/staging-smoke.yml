name: Staging Prospect Smoke Test

on:
  push:
    branches:
      - prospect-scoring-v1
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live staging prospect flow
        env:
          BASE_URL: https://ai-ops-command-center-staging.onrender.com
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          run_id = os.environ["RUN_ID"]

          def request(path, method="GET", payload=None, expected=(200,), retries=8):
              data = None
              headers = {"Accept": "application/json"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              last_error = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          body = resp.read().decode("utf-8")
                          if resp.status not in expected:
                              raise RuntimeError(f"{method} {path}: unexpected HTTP {resp.status}: {body[:1000]}")
                          return resp.status, body
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      if exc.code in expected:
                          return exc.code, body
                      last_error = RuntimeError(f"{method} {path}: HTTP {exc.code}: {body[:2000]}")
                      if attempt == retries - 1:
                          raise last_error
                      time.sleep(8)
                  except Exception as exc:
                      last_error = exc
                      if attempt == retries - 1:
                          raise
                      time.sleep(8)
              raise last_error

          print("1) Verify Prospects page loads")
          status, body = request("/static/prospects.html")
          assert "Prospect Command Center" in body
          print("PASS: prospects page", status)

          print("2) Verify Prospect Detail page loads with safety sections")
          status, body = request("/static/prospect-detail.html?id=1")
          assert "Prospect profile" in body
          assert "Pipeline history" in body
          assert "Contact protection" in body
          assert "Outreach history" in body
          assert "Nothing is sent from this page" in body
          print("PASS: prospect detail page", status)

          company = f"Staging Smoke Test Contractor {run_id}"
          email = f"smoke-{run_id}@test.invalid"
          print("3) Create one fake staging prospect")
          status, body = request(
              "/api/prospects",
              method="POST",
              payload={
                  "company": company,
                  "city": "Portsmouth",
                  "state": "VA",
                  "industry": "Electrical Contractor",
                  "email": email,
                  "source": "staging-smoke-test",
                  "hiring_signal": True,
                  "growth_signal": True,
                  "high_lead_volume_signal": True,
                  "manual_followup_signal": True,
                  "crm_need_signal": True,
                  "review_count": 500,
                  "locations_count": 3,
                  "automation_opportunities": ["lead follow-up"],
                  "evidence": ["staging test evidence one", "staging test evidence two"]
              },
              expected=(201,),
          )
          prospect = json.loads(body)["prospect"]
          prospect_id = prospect["id"]
          assert prospect["status"] == "new"
          print("PASS: created prospect", prospect_id, "stage=new")

          print("4) Confirm live detail API opens")
          status, body = request(f"/api/prospects/{prospect_id}")
          detail = json.loads(body)
          assert detail["company"] == company
          print("PASS: prospect detail API")

          print("5) Change stage New -> Qualified")
          status, body = request(
              f"/api/prospects/{prospect_id}/pipeline",
              method="POST",
              payload={"status": "qualified", "note": "Smoke test stage change before outreach."},
          )
          pipeline = json.loads(body)
          assert pipeline["changed"] is True
          assert pipeline["prospect"]["status"] == "qualified"
          print("PASS: stage qualified")

          print("6) Add a note")
          status, body = request(
              f"/api/prospects/{prospect_id}/notes",
              method="POST",
              payload={"note": "Smoke test note: reviewed fake prospect before outreach."},
              expected=(201,),
          )
          assert json.loads(body)["status"] == "created"
          print("PASS: note added")

          print("7) Confirm stage change and note in Pipeline History")
          status, body = request(f"/api/prospects/{prospect_id}/history")
          history = json.loads(body)
          assert history["current_status"] == "qualified"
          events = history["history"]
          assert any(e["event_type"] == "status_change" and e["from_status"] == "new" and e["to_status"] == "qualified" for e in events)
          assert any(e["event_type"] == "note" and "Smoke test note" in e["note"] for e in events)
          print("PASS: pipeline history")

          print("8) Verify contact protection is initially clear")
          status, body = request(f"/api/prospects/{prospect_id}/outreach-protection")
          protection = json.loads(body)
          assert protection["allowed"] is True
          assert protection["blocked"] is False
          print("PASS: protection clear")

          print("9) Generate live outreach preview and assert sent=false")
          status, body = request(
              f"/api/prospects/{prospect_id}/outreach-preview",
              method="POST",
              payload={},
          )
          preview = json.loads(body)
          assert preview["status"] == "preview"
          assert preview["prospect_id"] == prospect_id
          assert preview["sent"] is False
          assert preview["body"].strip()
          assert preview["outreach_attempt_id"] > 0
          print("PASS: outreach preview generated; sent=false")

          print("10) Verify generated preview is saved in Outreach History")
          status, body = request(f"/api/prospects/{prospect_id}/outreach-history")
          outreach = json.loads(body)
          assert outreach["count"] >= 1
          assert any(a["status"] == "preview" and a["id"] == preview["outreach_attempt_id"] for a in outreach["attempts"])
          print("PASS: preview recorded with timestamp/status")

          print("11) Record a sent-status audit marker only; endpoint must not send")
          status, body = request(
              f"/api/prospects/{prospect_id}/outreach-attempts",
              method="POST",
              payload={"status": "sent", "subject": "Smoke test audit marker", "reason": "test marker only; no email sent"},
              expected=(201,),
          )
          audit = json.loads(body)
          assert audit["status"] == "recorded"
          assert audit["sent"] is False
          assert "does not send email" in audit["note"]
          print("PASS: audit marker recorded; no email sent")

          print("12) Verify duplicate protection now blocks the same company/email")
          status, body = request(f"/api/prospects/{prospect_id}/outreach-protection")
          blocked = json.loads(body)
          assert blocked["allowed"] is False
          assert blocked["blocked"] is True
          assert blocked["match_type"] in ("email", "company")
          assert blocked["previous_attempt"]["status"] == "sent"
          print("PASS: duplicate contact blocked")

          print("13) Prove a second sent-status record is rejected and sent=false")
          status, body = request(
              f"/api/prospects/{prospect_id}/outreach-attempts",
              method="POST",
              payload={"status": "sent", "subject": "Duplicate should block"},
              expected=(409,),
          )
          duplicate = json.loads(body)
          assert duplicate["status"] == "blocked"
          assert duplicate["sent"] is False
          assert duplicate["attempt"]["status"] == "blocked"
          print("PASS: duplicate record rejected; sent=false")

          print("STAGING SAFETY SMOKE TEST PASSED")
          print("prospect_id=", prospect_id)
          print("company=", company)
          PY
